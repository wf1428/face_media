; @file net_cfg.ini
; @brief 设备网络、功能及媒体播放配置模板；已有外部配置沿用原加载规则。
; @author Du lin
; @note 最近修改：2026-11-03；修改人：Du lin；新增密码键盘呼叫按钮显示开关，启动读取且默认隐藏；保留DSP默认值及其他配置组。
[auto]
auto_ftp=true
auto_mqtt=true
auto_network=true
enable=true

[feature]
air_sys=true
broad_sys=false
media_sys=false
offline_v1=false
online_v1=true
online_v2=false
tbk_sys=false

[ftp]
auto_connect=true
host=www.ycest.vip
local_path=/mnt/UDISK/res/static/demoResources/images/video
password=ycadmin
port=8969
remote_path=/test1 .mp4
username=ycadmin

[main]
use_config=true

[mqtt]
client_id=YCEEQZA10C1FFC62
device_name=
host_online_v1=www.ycest.vip
host_online_v2=192.168.3.11
ipc_path=/tmp/mqttd.sock
keepalive=30
password_online_v1=
password_online_v2=
port=1883
protocol_mode=online
publish_topic_online_v1=device/ycLinux/YCEEQZA10C1FFC62/event
publish_topic_online_v2=device/yc/YCEEQZA10C1FFC62/event
qos=0
stream_url_topic_online_v1=device/ycLinux/YCEEQZA10C1FFC62/request
sub_topics_online_v1=device/ycLinux/YCEEQZA10C1FFC62/request
sub_topics_online_v2=device/yc/YCEEQZA10C1FFC62/responses
tls=false
use_config=true
username_online_v1=admin
username_online_v2=admin

[network]
# 速率：100-full 百兆、1000-full 千兆；旧 auto 兼容自动协商。
link_mode=100-full
auto_connect=true
dhcp=true
dns=192.168.3.1
gateway=192.168.3.1
iface=eth0
ip=192.168.3.137
netmask=255.255.255.0
use_config=true

[stream]
url=rtsp://192.168.3.11:554/live

[gstreamer]
audio_sink=alsasink

[audio]
card=0
device=plughw:CARD=rockchiprk809co,DEV=0
mixer_control=numid=3
amp_device=

[card_reader]
heartbeat_log_enabled=false

[qt_watchdog]
enabled=true

[fillLight]
; true 启用识别及管理状态补光，false 禁止开灯；缺少本字段默认 true，修改后重启 Qt 生效。
enabled=true

[paths]
storage_root=/mnt/UDISK
static_root=/mnt/UDISK/res/static
video_dir=/mnt/UDISK/res/static/demoResources/images/video
database=/home/cat/face_media/access_control.db

[playback]
contentType=VIDEO_IMAGE
smallImageMode=0

[VoiceCallDsp]
; 开机读取；true显示密码键盘“呼叫物业”，false或缺项隐藏；物理键不受影响。
showPropertyCallButton=false
; 每通电话读取一次；修改下一通生效。关闭下面两个主开关即可恢复V1直通。
aecEnabled=true
preprocessEnabled=true
; 仅preprocessEnabled=true时生效；默认AGC开启，VAD始终不门控音频。
denoiseEnabled=true
agcEnabled=true
; AEC尾长40~500ms，默认200ms=3200样本，不是播放缓冲。
filterLengthMs=200
; 正值取更早的实际播放参考，范围-100~300ms；需按板端测量校准。
referenceDelayMs=0
; 连续播放锚点容差1~20ms，历史8~64帧，每帧20ms。
alignmentToleranceMs=5
referenceHistoryFrames=32
; dB为负值；近端活动抑制限于-12~0且不能强于echoSuppressDb，保护双讲。
noiseSuppressDb=-10
echoSuppressDb=-40
echoSuppressActiveDb=-12
; 可选浮点AGC：目标1000~16000，最大增益0~12dB，上升1~12、下降-30~-1dB/s。
agcTarget=8000
agcMaxGainDb=6
agcIncrementDbPerSec=6
agcDecrementDbPerSec=-12
