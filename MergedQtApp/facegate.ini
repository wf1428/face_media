[camera]
device=/dev/video0
width=640
height=480
pixel_format=nv21

[camera_usb]
device=auto
width=640
height=480
fps=30
pixel_format=yuyv
auto_white_balance=true
white_balance_temperature=4600
auto_exposure=true
exposure_absolute=166
exposure_auto_priority=false
power_line_frequency=1

[model]
inspire_pack=./Gundam_RK356X
minifasnet_v2=./2.7_80x80_MiniFASNetV2.rknn
minifasnet_v1se=./4_0_0_80x80_MiniFASNetV1SE.rknn

[threshold]
face_cosine=0.50
duplicate_face_cosine=0.50
face_quality=0.50
face_detect=0.70
liveness=0.80

[verify]
collect_frame_count=5
liveness_pass_required=5
result_hold_ms=2000
same_face_suppress_ms=3000
liveness_enabled=true

[log]
snapshot_dir=./data/snapshots
save_failed_snapshot=true

[ui]
privacy_mode=false
stranger_prompt_cooldown_ms=2000

[enroll]
max_features_per_person=3

[database]
driver=QSQLITE
local_store_path=/home/cat/face_media/access_control.db
sqlite_path=/home/cat/face_media/access_control.db

[mysql]
host=127.0.0.1
port=3306
database=face_gate
user=root
password=

[network]
dhcp=true
static_ip=
netmask=
gateway=
dns=

[admin]
username=admin
password_hash=086bb2568a4af12e2ec03791221a43160ded4d71d2e155f8d748f5870acfdc9f
password_salt=FaceGateQt.default.admin.salt.v1
password_hint=初始密码：admin，首次登录后请修改
login_required=true
password_change_required=true

[maintenance]
backup_dir=./backup
disk_free_warn_mb=512



[audio]
enabled=true
player=aplay
device=plughw:CARD=rockchiprk809co,DEV=0
dir=./audio
volume=80
mixer_control=Playback
cooldown_ms=1500
prompt_verify_passed_enabled=true
prompt_verify_passed_text=验证通过，请通行
prompt_verify_passed_file=verify_passed.wav
prompt_verify_failed_enabled=true
prompt_verify_failed_text=验证失败，请正对摄像头
prompt_verify_failed_file=verify_failed.wav
prompt_stranger_enabled=true
prompt_stranger_text=未录入人员，请联系管理员
prompt_stranger_file=stranger.wav
prompt_liveness_failed_enabled=true
prompt_liveness_failed_text=活体检测失败，请重试
prompt_liveness_failed_file=liveness_failed.wav
prompt_enroll_success_enabled=true
prompt_enroll_success_text=录入成功
prompt_enroll_success_file=enroll_success.wav
prompt_enroll_failed_enabled=true
prompt_enroll_failed_text=录入失败，请重新采集
prompt_enroll_failed_file=enroll_failed.wav
