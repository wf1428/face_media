<!doctype html>
<!-- @file portal.html | @brief 热点自动窗口仅引导用户打开完整浏览器。 -->
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>打开设备管理</title>
    <link rel="stylesheet" href="/portal.css" />
    <script src="/portal.js" defer></script>
  </head>
  <body>
    <main class="card">
      <div class="badge">设备操作台</div>
      <h1>在浏览器中打开</h1>
      <p>已连接设备热点。请点击下方按钮，将设备管理地址带入手机浏览器。</p>
      <a id="open-browser" class="primary" hidden>打开浏览器并进入设备管理</a>
      <label for="server-address">设备管理地址</label>
      <input id="server-address" readonly aria-label="设备管理地址" />
      <button id="copy-address" type="button" disabled>复制管理地址</button>
      <p id="status" role="status" aria-live="polite">正在读取设备地址…</p>
      <p class="help">
        若手机未允许打开浏览器，请复制地址到手机浏览器访问；也可使用当前窗口菜单中的“在浏览器中打开”（如有）。请保持连接此热点。
      </p>
      <noscript>请启用 JavaScript，或在手机浏览器中访问设备管理地址。</noscript>
    </main>
  </body>
</html>
