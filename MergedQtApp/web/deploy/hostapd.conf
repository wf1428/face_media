# @file hostapd.conf
# @brief WPA2 专用热点样例，出厂必须替换独立热点密码及设备 SSID。
# @author Du lin
# @date 2026-10-09
interface=wlan0
driver=nl80211
ssid=DEVICE-SETUP
country_code=CN
hw_mode=g
channel=6
wmm_enabled=1
auth_algs=1
ignore_broadcast_ssid=0
wpa=2
wpa_key_mgmt=WPA-PSK
rsn_pairwise=CCMP
wpa_passphrase=__FACTORY_AP_PASSWORD__
