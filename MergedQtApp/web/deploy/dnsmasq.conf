# @file dnsmasq.conf
# @brief AP DHCP/DNS；手机自动获取地址，HTTP 探测引导到独立 HTTPS 服务。
# @author Du lin
# @date 2026-10-09
interface=wlan1
bind-dynamic
except-interface=lo
dhcp-range=192.168.50.20,192.168.50.100,255.255.255.0,12h
dhcp-option=3,192.168.50.1
dhcp-option=6,192.168.50.1
dhcp-leasefile=/run/device-hotspot/dnsmasq.leases
no-resolv
no-hosts
# DNS 劫持只用于本专用离线 AP；不能作为现有 LAN DNS 配置安装。
address=/#/192.168.50.1
# 仅在手机信任 HTTPS 证书且 dnsmasq 支持该选项时启用 CAPPORT API；不是网页 URL。
# dhcp-option=114,https://192.168.50.1/api/v1/captive
