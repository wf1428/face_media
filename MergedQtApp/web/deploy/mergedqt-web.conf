# @file mergedqt-web.conf
# @brief 安装为现有 Qt systemd 服务的 drop-in，不覆盖原 ExecStart/环境配置。
# @author Du lin
# @date 2026-10-09
[Service]
Environment=MERGEDQT_WEB_ENABLE=1
Environment=MERGEDQT_WEB_SOCKET=/run/mergedqt/web.sock
Environment=MERGEDQT_WEB_MEDIA_MOUNT=/mnt/UDISK
Environment=MERGEDQT_WEB_IMPORTS=/home/cat/web-stage/imports
Environment=MERGEDQT_WEB_FACTORY=/home/cat/web-stage/factory-account.json
RuntimeDirectory=mergedqt
RuntimeDirectoryMode=0750
RuntimeDirectoryPreserve=restart
# socket 与新 daemon 使用 cat 组；现有 Qt User 请维持原设置。
SupplementaryGroups=cat
